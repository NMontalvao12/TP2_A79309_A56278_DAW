openapi: 3.0.0
info:
  title: API de Monitorização de Qualidade do Ar
  description: API desenvolvida no âmbito da UC Dev. de Aplicações Web, da LESTI, para sincronizar dados da JuheAPI, processá-los e expô-los localmente.
  version: 1.0.0
  contact:
    name: José Victor Santos
servers:
  - url: http://localhost:3000
    description: Servidor Local

# Definição de Segurança Global
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
  schemas:
    City:
      type: object
      properties:
        id:
          type: integer
        search_query:
          type: string
        display_name:
          type: string
    Reading:
      type: object
      properties:
        city_id:
          type: integer
        aqi:
          type: integer
        aqi_category:
          type: string
        user_notes:
          type: string

security:
  - ApiKeyAuth: []

paths:
  /api/cities:
    get:
      summary: Listar cidades monitorizadas
      tags: [Cidades]
      responses:
        200:
          description: Lista de cidades retornada com sucesso.
    post:
      summary: Adicionar nova cidade
      tags: [Cidades]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - search_query
              properties:
                search_query:
                  type: string
                  example: "paris"
                display_name:
                  type: string
                  example: "Paris (França)"
      responses:
        201:
          description: Cidade criada e sincronização iniciada.

  /api/cities/readings:
    get:
      summary: Obter histórico global (todas as cidades)
      tags: [Leituras]
      parameters:
        - in: query
          name: start_date
          schema:
            type: string
            format: date
          description: Data de início (YYYY-MM-DD)
        - in: query
          name: end_date
          schema:
            type: string
            format: date
          description: Data de fim (YYYY-MM-DD)
        - in: query
          name: limit
          schema:
            type: integer
            default: 100
          description: Limite de resultados (Padrão 100)
      responses:
        200:
          description: Lista global retornada com sucesso.

  /api/cities/readings:
    get:
      summary: Listar cidades monitorizadas
      tags: [Cidades]
      responses:
        200:
          description: Lista de cidades retornada com sucesso.

  /api/cities/{id}/active:
    patch:
      summary: Ativar/Desativar cidade monitorizada
      tags: [Cidades]
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: ID da cidade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - is_active
              properties:
                is_active:
                  type: boolean
                  example: true
      responses:
        200:
          description: Estado atualizado com sucesso.
        400:
          description: Pedido inválido.
        404:
          description: Cidade não encontrada.

  /api/cities/{id}/readings:
    get:
      summary: Obter histórico de uma cidade
      tags: [Leituras]
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: ID da cidade
        - in: query
          name: start_date
          schema:
            type: string
            format: date
          description: Data de início (YYYY-MM-DD)
        - in: query
          name: end_date
          schema:
            type: string
            format: date
          description: Data de fim (YYYY-MM-DD)
        - in: query
          name: limit
          schema:
            type: integer
            default: 100
          description: Limite de resultados (Padrão 100)
      responses:
        200:
          description: Histórico retornado com sucesso.

  /api/cities/top/best:
    get:
      summary: Top 3 cidades com melhor AQI (mais baixo)
      tags: [Cidades]
      responses:
        200:
          description: Lista retornada com sucesso.

  /api/cities/top/worst:
    get:
      summary: Top 3 cidades com pior AQI (mais alto)
      tags: [Cidades]
      responses:
        200:
          description: Lista retornada com sucesso.

  /api/readings/{id}:
    patch:
      summary: Adicionar nota a uma leitura (Update)
      tags: [Leituras]
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user_notes
              properties:
                user_notes:
                  type: string
                  example: "Pico de poluição detetado devido ao trânsito."
      responses:
        200:
          description: Nota adicionada.
    delete:
      summary: Apagar uma leitura
      tags: [Leituras]
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      responses:
        200:
          description: Leitura removida.
  /api/admin/generate-key:
    post:
      summary: Gerar nova API Key (Apenas Admin)
      tags: [Admin]
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - client_name
              properties:
                client_name:
                  type: string
                  example: "Novo Cliente"
      responses:
        201:
          description: Chave gerada com sucesso.
        403:
          description: Apenas a chave Admin do .env é aceite.
  /api/admin/api-keys/{id}:
    delete:
      summary: Remover API Key por ID (Apenas Admin)
      tags: [Admin]
      security:
        - ApiKeyAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: ID da API Key
      responses:
        200:
          description: API Key removida com sucesso.
        404:
          description: API Key não encontrada.
        403:
          description: Apenas a chave Admin do .env é aceite.